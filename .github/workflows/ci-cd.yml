name: ReviewPulse CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-and-syntax:
    name: Code Quality & Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Syntax & Lint Checks
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning level checks
          flake8 src/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  unit-and-integration-tests:
    name: Test Suite & GenAI Validation
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'test_placeholder_key' }}
      MLFLOW_TRACKING_URI: sqlite:///mlflow.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Unit & Integration Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate Production Model Inference
        run: |
          python src/reviewpulse/predict.py "Superb sound quality, very satisfied!" "Broke after two days, terrible."

      - name: Validate Amazon GenAI Insights Engine
        run: |
          python src/reviewpulse/insights.py

  batch-pipeline-validation:
    name: End-to-End Batch Pipeline Test
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate Synthetic Test Dataset & Run Batch Pipeline
        run: |
          mkdir -p data
          python -c "
          import pandas as pd
          df = pd.DataFrame({
              'ProductId': ['PROD_A', 'PROD_A', 'PROD_B', 'PROD_B', 'PROD_C'],
              'Text': [
                  'Amazing performance and battery life!',
                  'Love the ergonomics and sound.',
                  'Terrible customer service and stopped working.',
                  'Defective unit on arrival.',
                  'Decent overall quality for the price.'
              ]
          })
          df.to_csv('data/ci_test_reviews.csv', index=False)
          "
          python src/reviewpulse/batch_score.py \
            --input data/ci_test_reviews.csv \
            --output data/ci_dashboard.csv \
            --output-scored data/ci_scored.csv \
            --ai-summary

      - name: Verify Output Artifacts
        run: |
          test -f data/ci_dashboard.csv || exit 1
          test -f data/ci_scored.csv || exit 1
          test -f data/product_ai_insights.json || exit 1
          echo "All pipeline outputs validated successfully!"

  docker-build:
    name: Container Build & Deployment Check
    runs-on: ubuntu-latest
    needs: batch-pipeline-validation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: reviewpulse:latest

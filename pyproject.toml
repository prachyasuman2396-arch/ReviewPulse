[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewpulse"
version = "0.1.0"
description = "Production Sentiment Analysis & Amazon-Style GenAI Review Insights Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "mlflow>=2.15.0",
    "joblib>=1.3.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "flake8>=7.0.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
